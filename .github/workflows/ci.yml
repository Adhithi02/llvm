name: ci

on:
  push:
  pull_request:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    env:
      LLVM_VERSION: "18"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18 llvm-18-dev clang-18 cmake

      - name: Build
        run: |
          chmod +x build.sh run.sh verify.sh clean.sh scripts/*.sh tests/verify_output.sh
          ./build.sh

      - name: Generate IR
        run: ./scripts/generate_ir.sh

      - name: Verify
        run: ./verify.sh
